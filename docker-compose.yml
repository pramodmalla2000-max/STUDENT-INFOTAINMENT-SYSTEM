services:
  mongodb:
    image: mongo:8.0
    container_name: student_infotainment_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: student_infotainment
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: student_infotainment_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/student_infotainment
      JWT_SECRET: production_super_secret_jwt_key_2026_student_infotainment
      JWT_REFRESH_SECRET: production_super_secret_refresh_key_2026_student_infotainment
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: student_infotainment_client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
